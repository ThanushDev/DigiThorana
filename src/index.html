<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Vesak Thorana 2026</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for Sinhala -->
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <h1 class="title">ඩිජිටල් වෙසක් තොරණ</h1>

        <div class="thorana-wrapper">
            <!-- Left Lantern -->
            <div class="lantern side-left">
                <img src="assets/kudu.png" alt="Vesak Kudu">
            </div>

            <!-- Main Thorana -->
            <div class="thorana-frame" id="thorana">
                <div class="light-ring" id="lightRing"></div>
                <div class="center-image">
                    <img src="assets/buddha.png" alt="Buddha">
                </div>
                <!-- Jathaka Katha Panels -->
                <div class="panel p1" onclick="showStory('Sasa Jathakaya')"></div>
                <div class="panel p2" onclick="showStory('Wessanthara Jathakaya')"></div>
                <div class="panel p3" onclick="showStory('Silawa Jathakaya')"></div>
            </div>

            <!-- Right Lantern -->
            <div class="lantern side-right">
                <img src="assets/kudu.png" alt="Vesak Kudu">
            </div>
        </div>

        <div id="story-box" class="story-display">කතාව කියවීමට රූපයක් මත ක්ලික් කරන්න</div>
    </div>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
